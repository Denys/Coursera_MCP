[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coursera-mcp"
version = "0.1.0"
description = "MCP server for Coursera — Claude connector for course context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "coursera", "claude", "connector", "education"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
coursera-mcp = "coursera_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coursera_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
